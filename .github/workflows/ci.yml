name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GitHub App credentials for the PR review agent (M1). Not consumed by
  # current tests; available once agent e2e coverage lands.
  GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
  GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}

jobs:
  # TypeScript static checks gate the job (fail fast). Tests use `if: always()`
  # so they still run and report when a static check fails.
  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Ephemeral test database. These are not production secrets.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          # Include lockfile hashes so dependency changes invalidate the cache.
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'packages/pr-review-agent/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm turbo run lint --filter='./apps/*'

      - name: Check formatting
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm turbo run typecheck --filter='./apps/*'

      - name: Run unit tests
        if: always()
        run: pnpm turbo run test --filter='./apps/*'

      - name: Apply database migrations
        if: always()
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres

      - name: Run API end-to-end tests
        if: always()
        run: pnpm --filter control-plane-api run test:e2e
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres

  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('packages/pr-review-agent/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Setup Python
        run: uv python install
        working-directory: packages/pr-review-agent

      - name: Install Python dependencies
        run: uv sync --frozen
        working-directory: packages/pr-review-agent

      - name: Run Python linter
        run: uv run ruff check .
        working-directory: packages/pr-review-agent

      - name: Check Python formatting
        run: uv run ruff format --check .
        working-directory: packages/pr-review-agent

      - name: Run Python unit tests
        run: uv run pytest
        working-directory: packages/pr-review-agent

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Docker Compose config
        run: docker compose --env-file .env.example config --quiet

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typescript, python, infrastructure]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'packages/pr-review-agent/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
