name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Run CI pipeline
    runs-on: ubuntu-latest

    env:
      # Connection string for the PostgreSQL service defined below. Provided
      # as a real environment variable (CI has no `.env` file).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # GitHub App credentials for the PR review agent e2e tests.
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install
        working-directory: packages/pr-review-agent

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --frozen
        working-directory: packages/pr-review-agent

      - name: Run linter
        run: pnpm lint

      - name: Run Python linter and formatter check
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: packages/pr-review-agent

      - name: Check formatting
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run Python unit tests
        run: uv run pytest
        working-directory: packages/pr-review-agent

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run API end-to-end tests
        run: pnpm --filter control-plane-api run test:e2e

      #   - name: Validate infrastructure configs
      #     run: pnpm test:infra

      - name: Build
        run: pnpm build
