name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # TypeScript static checks gate the job (fail fast). Tests use `if: always()`
  # so they still run and report when a static check fails.
  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Ephemeral test database. These are not production secrets.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          # Include lockfile hashes so dependency changes invalidate the cache.
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm turbo run lint --filter='./apps/*'

      - name: Check formatting
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm turbo run typecheck --filter='./apps/*'

      - name: Run unit tests
        if: always()
        run: pnpm turbo run test --filter='./apps/*'

      - name: Apply database migrations
        if: always()
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres

      - name: Run API end-to-end tests
        if: always()
        run: pnpm --filter control-plane-api run test:e2e
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Docker Compose config
        run: docker compose --env-file .env.example config --quiet

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typescript, infrastructure]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
