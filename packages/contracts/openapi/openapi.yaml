openapi: 3.0.3
info:
  title: Local AI Control Plane API
  version: 0.1.0
  description: |
    Shared contract for Control Plane HTTP APIs used by M1 (GitHub PR review).
    Fleet/node management endpoints will be added when those consumers exist.
servers:
  - url: https://localhost:3000
    description: Local HTTPS Control Plane API
tags:
  - name: webhooks
    description: Public ingress validated by provider signatures
  - name: review-runs
    description: Review run persistence for the PR review agent
paths:
  /webhooks/github:
    post:
      tags: [webhooks]
      operationId: githubWebhook
      summary: Receive GitHub webhook events
      description: |
        Public endpoint. Must validate `x-hub-signature-256` against
        `GITHUB_WEBHOOK_SECRET`. Not behind node mTLS.
      parameters:
        - name: x-hub-signature-256
          in: header
          required: true
          schema:
            type: string
        - name: x-github-event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Event accepted for processing
        "401":
          description: Invalid signature
  /review-runs:
    post:
      tags: [review-runs]
      operationId: createReviewRun
      summary: Create a review run
      description: Authenticated agent/internal credential required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRunRequest"
      responses:
        "201":
          description: Review run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRun"
        "401":
          description: Unauthorized
  /review-runs/{id}:
    get:
      tags: [review-runs]
      operationId: getReviewRun
      summary: Get a review run by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReviewRunId"
      responses:
        "200":
          description: Review run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRun"
        "401":
          description: Unauthorized
        "404":
          description: Not found
  /review-runs/{id}/findings:
    post:
      tags: [review-runs]
      operationId: createReviewFindings
      summary: Attach findings to a review run
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReviewRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFindingsRequest"
      responses:
        "201":
          description: Findings stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsResponse"
        "401":
          description: Unauthorized
        "404":
          description: Review run not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Internal agent/service token (M1). Node mTLS is a separate surface.
  parameters:
    ReviewRunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ReviewRunStatus:
      type: string
      enum: [running, completed, failed]
    FindingSeverity:
      type: string
      enum: [info, low, medium, high, critical]
    CreateReviewRunRequest:
      type: object
      required: [repo, prNumber]
      properties:
        repo:
          type: string
          description: owner/name
        prNumber:
          type: integer
          minimum: 1
        nodeId:
          type: string
          format: uuid
          nullable: true
          description: Optional; null when the agent runs locally (M1).
    ReviewRun:
      type: object
      required: [id, repo, prNumber, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        repo:
          type: string
        prNumber:
          type: integer
        status:
          $ref: "#/components/schemas/ReviewRunStatus"
        nodeId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    Finding:
      type: object
      required: [file, severity, confidence, message]
      properties:
        file:
          type: string
        line:
          type: integer
          nullable: true
        severity:
          $ref: "#/components/schemas/FindingSeverity"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        message:
          type: string
    CreateFindingsRequest:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        status:
          $ref: "#/components/schemas/ReviewRunStatus"
          description: Optional terminal status to set on the review run.
    FindingsResponse:
      type: object
      required: [reviewRunId, findings]
      properties:
        reviewRunId:
          type: string
          format: uuid
        findings:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Finding"
              - type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
