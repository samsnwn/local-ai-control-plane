openapi: 3.0.3
info:
  title: Local AI Control Plane API
  version: 0.1.0
  description: |
    Shared contract for Control Plane HTTP APIs.
    Fleet/node management endpoints will be added as those features ship.
servers:
  - url: https://localhost:3000
    description: Local HTTPS Control Plane API
tags:
  - name: nodes
    description: Node registration and management
paths:
  /nodes/register:
    post:
      tags: [nodes]
      operationId: registerNode
      summary: Register a new node
      description: |
        mTLS-authenticated endpoint. Registers a customer node with the Control Plane.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterNodeRequest"
      responses:
        "201":
          description: Node registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          description: Unauthorized (mTLS required)
        "409":
          description: Node already registered
  /nodes:
    get:
      tags: [nodes]
      operationId: listNodes
      summary: List registered nodes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Operator JWT token.
  schemas:
    NodeStatus:
      type: string
      enum: [active, inactive, unknown]
    RegisterNodeRequest:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
          description: Human-readable hostname of the node
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional node metadata (OS, hardware, etc.)
    Node:
      type: object
      required: [id, hostname, status, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        status:
          $ref: "#/components/schemas/NodeStatus"
        registeredAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
